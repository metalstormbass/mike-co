name: Build and Push Images to GHCR

on:
  push:
    branches:
      - original
  pull_request:
    branches:
      - original
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: nginx
            context: ./services/nginx
            dockerfile: ./services/nginx/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: frontend
            context: ./services/frontend
            dockerfile: ./services/frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: document-processor
            context: ./services/document-processor
            dockerfile: ./services/document-processor/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: embedding-service
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile.cpu
            platforms: linux/amd64
          - service: llm-service
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile.cpu
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for scanning (AMD64 only)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' ${{ matrix.service }}:scan)
          echo "sha=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Get image size
        id: size
        run: |
          SIZE_BYTES=$(docker inspect --format='{{.Size}}' ${{ matrix.service }}:scan)
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
          if (( $(echo "$SIZE_GB >= 1" | bc -l) )); then
            SIZE="${SIZE_GB} GB"
          else
            SIZE="${SIZE_MB} MB"
          fi
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "size_bytes=${SIZE_BYTES}" >> $GITHUB_OUTPUT

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype vulnerability scan
        run: |
          grype ${{ matrix.service }}:scan -o json > grype-results.json || true

      - name: Generate scan report
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_SHA: ${{ steps.digest.outputs.sha }}
          IMAGE_SIZE: ${{ steps.size.outputs.size }}
        run: |
          mkdir -p docs/security-scans
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}"
          OUTFILE="docs/security-scans/${SERVICE}.md"
          
          echo "# ${SERVICE}" > "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "Container image for the **${SERVICE}** service." >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Image Details" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Property | Value |" >> "$OUTFILE"
          echo "|----------|-------|" >> "$OUTFILE"
          echo "| **Image** | \`${IMAGE_NAME}\` |" >> "$OUTFILE"
          echo "| **Digest** | \`${IMAGE_SHA}\` |" >> "$OUTFILE"
          echo "| **Size** | ${IMAGE_SIZE} |" >> "$OUTFILE"
          echo "| **Scan Date** | ${SCAN_DATE} |" >> "$OUTFILE"
          echo "| **Scanner** | Grype |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Vulnerability Summary" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          
          if [ -f grype-results.json ]; then
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            echo "| Severity | Count |" >> "$OUTFILE"
            echo "|----------|-------|" >> "$OUTFILE"
            echo "| \$\\color{red}{\\textsf{Critical}}\$ | ${CRITICAL} |" >> "$OUTFILE"
            echo "| \$\\color{orange}{\\textsf{High}}\$ | ${HIGH} |" >> "$OUTFILE"
            echo "| \$\\color{gold}{\\textsf{Medium}}\$ | ${MEDIUM} |" >> "$OUTFILE"
            echo "| \$\\color{green}{\\textsf{Low}}\$ | ${LOW} |" >> "$OUTFILE"
            echo "| \$\\color{gray}{\\textsf{Negligible}}\$ | ${NEGLIGIBLE} |" >> "$OUTFILE"
            echo "| **Total** | **${TOTAL}** |" >> "$OUTFILE"
            echo "" >> "$OUTFILE"
            
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Detailed Findings" >> "$OUTFILE"
              echo "" >> "$OUTFILE"
              echo "| Severity | Package | Version | Vulnerability | Fixed In |" >> "$OUTFILE"
              echo "|----------|---------|---------|---------------|----------|" >> "$OUTFILE"
              
              # Sort by severity: Critical, High, Medium, Low, Negligible
              jq -r '.matches | sort_by(
                if .vulnerability.severity == "Critical" then 0
                elif .vulnerability.severity == "High" then 1
                elif .vulnerability.severity == "Medium" then 2
                elif .vulnerability.severity == "Low" then 3
                else 4 end
              )[:50][] | 
                if .vulnerability.severity == "Critical" then "| 🔴 Critical"
                elif .vulnerability.severity == "High" then "| 🟠 High"
                elif .vulnerability.severity == "Medium" then "| 🟡 Medium"
                elif .vulnerability.severity == "Low" then "| 🟢 Low"
                else "| ⚪ Negligible" end + 
                " | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> "$OUTFILE"
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> "$OUTFILE"
                echo "*Showing top 50 of ${TOTAL} vulnerabilities (sorted by severity)*" >> "$OUTFILE"
              fi
            else
              echo "No vulnerabilities found." >> "$OUTFILE"
            fi
          fi

      - name: Add scan results to job summary
        run: cat docs/security-scans/${{ matrix.service }}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: docs/security-scans/${{ matrix.service }}.md
          retention-days: 90

      - name: Build and push multi-arch Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup
        if: always()
        run: |
          docker system prune -af --volumes
          df -h

  mirror-external-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        include:
          - service: opensearch
            source_image: opensearchproject/opensearch:2.11.0
            tag: "2.11.0"
          - service: postgresql
            source_image: postgres:16-bookworm
            tag: "16-bookworm"
          - service: redis
            source_image: redis:7-bookworm
            tag: "7-bookworm"
          - service: ollama
            source_image: ollama/ollama:latest
            tag: "latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull external image
        run: docker pull ${{ matrix.source_image }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ matrix.source_image }})
          echo "sha=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Get image size
        id: size
        run: |
          SIZE_BYTES=$(docker inspect --format='{{.Size}}' ${{ matrix.source_image }})
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
          if (( $(echo "$SIZE_GB >= 1" | bc -l) )); then
            SIZE="${SIZE_GB} GB"
          else
            SIZE="${SIZE_MB} MB"
          fi
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "size_bytes=${SIZE_BYTES}" >> $GITHUB_OUTPUT

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype vulnerability scan
        run: |
          grype ${{ matrix.source_image }} -o json > grype-results.json || true

      - name: Generate scan report
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_IMAGE: ${{ matrix.source_image }}
          IMAGE_SHA: ${{ steps.digest.outputs.sha }}
          IMAGE_SIZE: ${{ steps.size.outputs.size }}
        run: |
          mkdir -p docs/security-scans
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}"
          OUTFILE="docs/security-scans/${SERVICE}.md"
          
          echo "# ${SERVICE}" > "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "Mirrored container image for the **${SERVICE}** service." >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Image Details" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Property | Value |" >> "$OUTFILE"
          echo "|----------|-------|" >> "$OUTFILE"
          echo "| **Source Image** | \`${SOURCE_IMAGE}\` |" >> "$OUTFILE"
          echo "| **GHCR Image** | \`${IMAGE_NAME}\` |" >> "$OUTFILE"
          echo "| **Digest** | \`${IMAGE_SHA}\` |" >> "$OUTFILE"
          echo "| **Size** | ${IMAGE_SIZE} |" >> "$OUTFILE"
          echo "| **Scan Date** | ${SCAN_DATE} |" >> "$OUTFILE"
          echo "| **Scanner** | Grype |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Vulnerability Summary" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          
          if [ -f grype-results.json ]; then
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            echo "| Severity | Count |" >> "$OUTFILE"
            echo "|----------|-------|" >> "$OUTFILE"
            echo "| \$\\color{red}{\\textsf{Critical}}\$ | ${CRITICAL} |" >> "$OUTFILE"
            echo "| \$\\color{orange}{\\textsf{High}}\$ | ${HIGH} |" >> "$OUTFILE"
            echo "| \$\\color{gold}{\\textsf{Medium}}\$ | ${MEDIUM} |" >> "$OUTFILE"
            echo "| \$\\color{green}{\\textsf{Low}}\$ | ${LOW} |" >> "$OUTFILE"
            echo "| \$\\color{gray}{\\textsf{Negligible}}\$ | ${NEGLIGIBLE} |" >> "$OUTFILE"
            echo "| **Total** | **${TOTAL}** |" >> "$OUTFILE"
            echo "" >> "$OUTFILE"
            
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Detailed Findings" >> "$OUTFILE"
              echo "" >> "$OUTFILE"
              echo "| Severity | Package | Version | Vulnerability | Fixed In |" >> "$OUTFILE"
              echo "|----------|---------|---------|---------------|----------|" >> "$OUTFILE"
              
              # Sort by severity: Critical, High, Medium, Low, Negligible
              jq -r '.matches | sort_by(
                if .vulnerability.severity == "Critical" then 0
                elif .vulnerability.severity == "High" then 1
                elif .vulnerability.severity == "Medium" then 2
                elif .vulnerability.severity == "Low" then 3
                else 4 end
              )[:50][] | 
                if .vulnerability.severity == "Critical" then "| 🔴 Critical"
                elif .vulnerability.severity == "High" then "| 🟠 High"
                elif .vulnerability.severity == "Medium" then "| 🟡 Medium"
                elif .vulnerability.severity == "Low" then "| 🟢 Low"
                else "| ⚪ Negligible" end + 
                " | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> "$OUTFILE"
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> "$OUTFILE"
                echo "*Showing top 50 of ${TOTAL} vulnerabilities (sorted by severity)*" >> "$OUTFILE"
              fi
            else
              echo "No vulnerabilities found." >> "$OUTFILE"
            fi
          fi

      - name: Add scan results to job summary
        run: cat docs/security-scans/${{ matrix.service }}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: docs/security-scans/${{ matrix.service }}.md
          retention-days: 90

      - name: Tag and push to GHCR
        run: |
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  commit-scan-results:
    runs-on: ubuntu-latest
    needs: [build-and-push, mirror-external-images]
    if: github.event_name != 'pull_request' && always() && (needs.build-and-push.result == 'success' || needs.mirror-external-images.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: scan-artifacts
          merge-multiple: false

      - name: Move scan results to docs folder
        run: |
          mkdir -p docs/security-scans
          for dir in scan-artifacts/scan-*; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.md docs/security-scans/
            fi
          done
          ls -la docs/security-scans/

      - name: Generate summary README
        run: |
          SCAN_DATE=$(date -u '+%Y-%m-%d')
          OUTFILE="docs/security-scans/README.md"
          
          # Initialize counters
          TOTAL_CRITICAL=0
          TOTAL_HIGH=0
          TOTAL_MEDIUM=0
          TOTAL_LOW=0
          TOTAL_NEGLIGIBLE=0
          
          cat > "$OUTFILE" << 'EOF'
          # Security Scan Results

          This directory contains vulnerability scan results for all container images in the RAG Knowledge Base application.

          Scans are automatically generated by the CI/CD pipeline using [Grype](https://github.com/anchore/grype).

          EOF
          
          # Remove leading whitespace
          sed -i 's/^          //' "$OUTFILE"
          
          echo "## Summary" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Image | Size | Scan Date | Critical | High | Medium | Low | Negligible | Total |" >> "$OUTFILE"
          echo "|-------|------|-----------|----------|------|--------|-----|------------|-------|" >> "$OUTFILE"

          # Process each scan report
          for report in docs/security-scans/*.md; do
            if [ "$(basename "$report")" != "README.md" ]; then
              SERVICE=$(basename "$report" .md)

              # Extract counts from each report
              CRITICAL=$(grep -A 1 "Critical" "$report" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")
              HIGH=$(grep -A 1 "High" "$report" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")
              MEDIUM=$(grep -A 1 "Medium" "$report" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")
              LOW=$(grep -A 1 "Low" "$report" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")
              NEGLIGIBLE=$(grep -A 1 "Negligible" "$report" | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")

              # Extract size and scan date
              SIZE=$(grep "Size" "$report" | sed 's/.*| \([^|]*\) |$/\1/' | tr -d '`' || echo "N/A")
              REPORT_SCAN_DATE=$(grep "Scan Date" "$report" | sed 's/.*| \([^|]*\) |$/\1/' | cut -d' ' -f1 || echo "N/A")

              # Calculate total (including negligible)
              REPORT_TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW + NEGLIGIBLE))

              # Add to running totals
              TOTAL_CRITICAL=$((TOTAL_CRITICAL + CRITICAL))
              TOTAL_HIGH=$((TOTAL_HIGH + HIGH))
              TOTAL_MEDIUM=$((TOTAL_MEDIUM + MEDIUM))
              TOTAL_LOW=$((TOTAL_LOW + LOW))
              TOTAL_NEGLIGIBLE=$((TOTAL_NEGLIGIBLE + NEGLIGIBLE))

              echo "| [${SERVICE}](./${SERVICE}.md) | ${SIZE} | ${REPORT_SCAN_DATE} | ${CRITICAL} | ${HIGH} | ${MEDIUM} | ${LOW} | ${NEGLIGIBLE} | ${REPORT_TOTAL} |" >> "$OUTFILE"
            fi
          done

          # Calculate grand total (including negligible)
          GRAND_TOTAL=$((TOTAL_CRITICAL + TOTAL_HIGH + TOTAL_MEDIUM + TOTAL_LOW + TOTAL_NEGLIGIBLE))

          echo "| **TOTAL** | - | - | **${TOTAL_CRITICAL}** | **${TOTAL_HIGH}** | **${TOTAL_MEDIUM}** | **${TOTAL_LOW}** | **${TOTAL_NEGLIGIBLE}** | **${GRAND_TOTAL}** |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          
          # Add severity summary
          echo "### Vulnerability Totals by Severity" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Severity | Count |" >> "$OUTFILE"
          echo "|----------|-------|" >> "$OUTFILE"
          echo "| 🔴 Critical | ${TOTAL_CRITICAL} |" >> "$OUTFILE"
          echo "| 🟠 High | ${TOTAL_HIGH} |" >> "$OUTFILE"
          echo "| 🟡 Medium | ${TOTAL_MEDIUM} |" >> "$OUTFILE"
          echo "| 🟢 Low | ${TOTAL_LOW} |" >> "$OUTFILE"
          echo "| ⚪ Negligible | ${TOTAL_NEGLIGIBLE} |" >> "$OUTFILE"
          echo "| **Total** | **${GRAND_TOTAL}** |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          
          # Add last updated
          echo "---" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "**Last Updated:** ${SCAN_DATE}" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          
          # Add scan reports section
          echo "## Scan Reports" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "### Custom Built Images" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Service | Scan Report |" >> "$OUTFILE"
          echo "|---------|-------------|" >> "$OUTFILE"
          echo "| nginx | [nginx.md](./nginx.md) |" >> "$OUTFILE"
          echo "| frontend | [frontend.md](./frontend.md) |" >> "$OUTFILE"
          echo "| api-gateway | [api-gateway.md](./api-gateway.md) |" >> "$OUTFILE"
          echo "| document-processor | [document-processor.md](./document-processor.md) |" >> "$OUTFILE"
          echo "| embedding-service | [embedding-service.md](./embedding-service.md) |" >> "$OUTFILE"
          echo "| llm-service | [llm-service.md](./llm-service.md) |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "### Mirrored External Images" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Service | Scan Report |" >> "$OUTFILE"
          echo "|---------|-------------|" >> "$OUTFILE"
          echo "| opensearch | [opensearch.md](./opensearch.md) |" >> "$OUTFILE"
          echo "| postgresql | [postgresql.md](./postgresql.md) |" >> "$OUTFILE"
          echo "| redis | [redis.md](./redis.md) |" >> "$OUTFILE"
          echo "| ollama | [ollama.md](./ollama.md) |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Update Frequency" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "Scan results are updated automatically on every push to \`original\` branch." >> "$OUTFILE"

      - name: Commit and push scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/security-scans/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update security scan results [skip ci]"
            git push
          fi
