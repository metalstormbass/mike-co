name: Build and Push Images to GHCR

on:
  push:
    branches:
      - original
      - chainguard
    paths:
      - 'services/**'
      - 'docker-compose.yaml'
      - '.github/workflows/build-push.yaml'
  pull_request:
    branches:
      - original
  workflow_dispatch:
  schedule:
    # Run weekly to catch new vulnerabilities
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: nginx
            context: ./services/nginx
            dockerfile: ./services/nginx/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: frontend
            context: ./services/frontend
            dockerfile: ./services/frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: document-processor
            context: ./services/document-processor
            dockerfile: ./services/document-processor/Dockerfile
            platforms: linux/amd64,linux/arm64
          - service: embedding-service
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile.cpu
            platforms: linux/amd64
          - service: llm-service
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile.cpu
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean apt cache
          sudo apt-get clean

          # Remove unnecessary packages
          sudo apt-get autoremove -y

          # Clean Docker
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Chainguard
        env:
          CG_U: ${{ secrets.CG_U }}
          CG_P: ${{ secrets.CG_P }}
        run: |
          if [ -n "${CG_U}" ] && [ -n "${CG_P}" ]; then
            echo "Authenticating with Chainguard..."
            echo "${CG_P}" | docker login cgr.dev --username "${CG_U}" --password-stdin
            echo "Successfully authenticated with Chainguard"
          else
            echo "Warning: CG_U or CG_P not set, Chainguard images may not be accessible"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for scanning (AMD64 only)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' ${{ matrix.service }}:scan)
          echo "sha=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Get image size
        id: size
        run: |
          SIZE_BYTES=$(docker inspect --format='{{.Size}}' ${{ matrix.service }}:scan)
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
          if (( $(echo "$SIZE_GB >= 1" | bc -l) )); then
            SIZE="${SIZE_GB} GB"
          else
            SIZE="${SIZE_MB} MB"
          fi
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "size_bytes=${SIZE_BYTES}" >> $GITHUB_OUTPUT

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype vulnerability scan
        run: |
          grype ${{ matrix.service }}:scan -o json > grype-results.json || true

      - name: Generate scan report
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_SHA: ${{ steps.digest.outputs.sha }}
          IMAGE_SIZE: ${{ steps.size.outputs.size }}
        run: |
          mkdir -p docs/security-scans
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}"
          OUTFILE="docs/security-scans/${SERVICE}.md"

          echo "# ${SERVICE}" > "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "Container image for the **${SERVICE}** service." >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Image Details" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Property | Value |" >> "$OUTFILE"
          echo "|----------|-------|" >> "$OUTFILE"
          echo "| **Image** | \`${IMAGE_NAME}\` |" >> "$OUTFILE"
          echo "| **Digest** | \`${IMAGE_SHA}\` |" >> "$OUTFILE"
          echo "| **Size** | ${IMAGE_SIZE} |" >> "$OUTFILE"
          echo "| **Scan Date** | ${SCAN_DATE} |" >> "$OUTFILE"
          echo "| **Scanner** | Grype |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Vulnerability Summary" >> "$OUTFILE"
          echo "" >> "$OUTFILE"

          if [ -f grype-results.json ]; then
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)

            echo "| Severity | Count |" >> "$OUTFILE"
            echo "|----------|-------|" >> "$OUTFILE"
            echo "| \$\\color{red}{\\textsf{Critical}}\$ | ${CRITICAL} |" >> "$OUTFILE"
            echo "| \$\\color{orange}{\\textsf{High}}\$ | ${HIGH} |" >> "$OUTFILE"
            echo "| \$\\color{gold}{\\textsf{Medium}}\$ | ${MEDIUM} |" >> "$OUTFILE"
            echo "| \$\\color{green}{\\textsf{Low}}\$ | ${LOW} |" >> "$OUTFILE"
            echo "| \$\\color{gray}{\\textsf{Negligible}}\$ | ${NEGLIGIBLE} |" >> "$OUTFILE"
            echo "| **Total** | **${TOTAL}** |" >> "$OUTFILE"
            echo "" >> "$OUTFILE"

            if [ "$TOTAL" -gt 0 ]; then
              echo "## Detailed Findings" >> "$OUTFILE"
              echo "" >> "$OUTFILE"
              echo "| Severity | Package | Version | Vulnerability | Fixed In |" >> "$OUTFILE"
              echo "|----------|---------|---------|---------------|----------|" >> "$OUTFILE"

              # Sort by severity: Critical, High, Medium, Low, Negligible
              jq -r '.matches | sort_by(
                if .vulnerability.severity == "Critical" then 0
                elif .vulnerability.severity == "High" then 1
                elif .vulnerability.severity == "Medium" then 2
                elif .vulnerability.severity == "Low" then 3
                else 4 end
              )[:50][] |
                if .vulnerability.severity == "Critical" then "| 🔴 Critical"
                elif .vulnerability.severity == "High" then "| 🟠 High"
                elif .vulnerability.severity == "Medium" then "| 🟡 Medium"
                elif .vulnerability.severity == "Low" then "| 🟢 Low"
                else "| ⚪ Negligible" end +
                " | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> "$OUTFILE"

              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> "$OUTFILE"
                echo "*Showing top 50 of ${TOTAL} vulnerabilities (sorted by severity)*" >> "$OUTFILE"
              fi
            else
              echo "✅ No vulnerabilities found." >> "$OUTFILE"
            fi
          fi

      - name: Add scan results to job summary
        run: cat docs/security-scans/${{ matrix.service }}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: docs/security-scans/${{ matrix.service }}.md
          retention-days: 90

      - name: Clean up scan image to free disk space
        run: |
          docker rmi ${{ matrix.service }}:scan || true
          docker system prune -f
          echo "Disk space after cleanup:"
          df -h

      - name: Build and push multi-arch Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup
        if: always()
        run: |
          docker system prune -af --volumes
          df -h

  scan-external-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove unnecessary packages and files
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h

      - name: Install yq for YAML parsing
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Authenticate with Chainguard
        env:
          CG_U: ${{ secrets.CG_U }}
          CG_P: ${{ secrets.CG_P }}
        run: |
          if [ -n "${CG_U}" ] && [ -n "${CG_P}" ]; then
            echo "Authenticating with Chainguard..."
            echo "${CG_P}" | docker login cgr.dev --username "${CG_U}" --password-stdin
            echo "Successfully authenticated with Chainguard"
          else
            echo "CG_U or CG_P not set, skipping Chainguard authentication"
          fi

      - name: Parse external images from docker-compose.yaml
        id: parse
        run: |
          echo "Parsing docker-compose.yaml for external images..."

          # Extract services that use 'image:' instead of 'build:'
          SERVICES=$(yq eval '.services | to_entries | .[] | select(.value.image) | .key' docker-compose.yaml)

          # Create arrays for the matrix
          IMAGES_JSON="["
          FIRST=true

          for service in $SERVICES; do
            IMAGE=$(yq eval ".services.${service}.image" docker-compose.yaml)

            # Skip if empty
            if [ -z "$IMAGE" ]; then
              continue
            fi

            # Add to JSON array
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              IMAGES_JSON="${IMAGES_JSON},"
            fi

            IMAGES_JSON="${IMAGES_JSON}{\"service\":\"${service}\",\"image\":\"${IMAGE}\"}"
          done

          IMAGES_JSON="${IMAGES_JSON}]"

          echo "Found external images:"
          echo "$IMAGES_JSON" | jq -r '.[] | "\(.service): \(.image)"'

          echo "matrix=${IMAGES_JSON}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan and generate reports
        run: |
          mkdir -p docs/security-scans
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # Parse the matrix output
          IMAGES='${{ steps.parse.outputs.matrix }}'

          echo "$IMAGES" | jq -c '.[]' | while read -r item; do
            SERVICE=$(echo "$item" | jq -r '.service')
            IMAGE=$(echo "$item" | jq -r '.image')

            echo "Processing $SERVICE with image $IMAGE..."

            # Note if Chainguard image (authentication already handled above)
            if [[ "$IMAGE" == cgr.dev/mikeco.com/* ]]; then
              echo "Chainguard private image detected (authentication handled via docker login)"
            fi

            # Get image size from manifest before pulling (to decide scanning strategy)
            echo "Checking image size for $SERVICE..."
            MANIFEST=$(docker manifest inspect "$IMAGE" 2>/dev/null || echo "{}")

            if [ "$MANIFEST" != "{}" ]; then
              # Check if this is a manifest list (multi-arch) or a single image manifest
              IS_MANIFEST_LIST=$(echo "$MANIFEST" | jq -r '.manifests != null')

              if [ "$IS_MANIFEST_LIST" = "true" ]; then
                # For manifest lists, get the linux/amd64 platform manifest
                echo "Multi-arch manifest detected, selecting linux/amd64 platform..."
                PLATFORM_DIGEST=$(echo "$MANIFEST" | jq -r '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux") | .digest' | head -1)

                if [ -n "$PLATFORM_DIGEST" ] && [ "$PLATFORM_DIGEST" != "null" ]; then
                  # Get the specific platform manifest
                  IMAGE_WITH_DIGEST="${IMAGE%:*}@${PLATFORM_DIGEST}"
                  PLATFORM_MANIFEST=$(docker manifest inspect "$IMAGE_WITH_DIGEST" 2>/dev/null || echo "{}")
                  SIZE_BYTES=$(echo "$PLATFORM_MANIFEST" | jq '[.layers[].size] | add // 0')
                else
                  # Fallback: sum all manifests (approximation)
                  SIZE_BYTES=$(echo "$MANIFEST" | jq '[.manifests[].size] | add // 0')
                fi
              else
                # Single image manifest, get layer sizes
                SIZE_BYTES=$(echo "$MANIFEST" | jq '[.layers[].size] | add // 0')
              fi
            else
              # Fallback
              SIZE_BYTES="0"
            fi

            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
            SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)

            if (( $(echo "$SIZE_GB >= 1" | bc -l) )); then
              SIZE="${SIZE_GB} GB"
            else
              SIZE="${SIZE_MB} MB"
            fi

            echo "Image size: $SIZE"

            # Determine scanning strategy based on size
            # For large images (>4 GB), use registry scanning to avoid disk space issues
            USE_REGISTRY_SCAN=false
            if (( $(echo "$SIZE_GB > 4" | bc -l) )); then
              echo "Large image detected (>4 GB), using registry scanning mode"
              USE_REGISTRY_SCAN=true
            fi

            # Get digest and run scan based on strategy
            if [ "$USE_REGISTRY_SCAN" = true ]; then
              # For registry scanning, get digest from manifest
              DIGEST=$(docker manifest inspect "$IMAGE" 2>/dev/null | jq -r '.config.digest // "N/A"' || echo "N/A")

              # Run vulnerability scan using registry mode (no pull required)
              echo "Scanning $SERVICE from registry..."
              grype "registry:$IMAGE" -o json > "grype-${SERVICE}.json" || true
            else
              # For smaller images, use traditional docker daemon scanning
              # Try to pull the image
              if ! docker pull "$IMAGE" 2>/dev/null; then
                echo "Warning: Could not pull $IMAGE (may require authentication)"
                echo "Skipping $SERVICE..."
                continue
              fi

              # Get digest from local image
              DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null || echo "N/A")

              # Run vulnerability scan
              echo "Scanning $SERVICE..."
              grype "$IMAGE" -o json > "grype-${SERVICE}.json" || true
            fi

            # Generate report
            OUTFILE="docs/security-scans/${SERVICE}.md"
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}"

            echo "# ${SERVICE}" > "$OUTFILE"
            echo "" >> "$OUTFILE"

            # Check if this is a Chainguard image
            if [[ "$IMAGE" == cgr.dev/mikeco.com/* ]]; then
              echo "**Chainguard hardened container image** for the **${SERVICE}** service." >> "$OUTFILE"
            elif [[ "$IMAGE" == cgr.dev/chainguard/* ]]; then
              echo "**Chainguard public container image** for the **${SERVICE}** service." >> "$OUTFILE"
            else
              echo "External container image for the **${SERVICE}** service." >> "$OUTFILE"
            fi

            echo "" >> "$OUTFILE"
            echo "## Image Details" >> "$OUTFILE"
            echo "" >> "$OUTFILE"
            echo "| Property | Value |" >> "$OUTFILE"
            echo "|----------|-------|" >> "$OUTFILE"
            echo "| **Source Image** | \`${IMAGE}\` |" >> "$OUTFILE"
            echo "| **Digest** | \`${DIGEST}\` |" >> "$OUTFILE"
            echo "| **Size** | ${SIZE} |" >> "$OUTFILE"
            echo "| **Scan Date** | ${SCAN_DATE} |" >> "$OUTFILE"
            echo "| **Scanner** | Grype |" >> "$OUTFILE"
            echo "" >> "$OUTFILE"
            echo "## Vulnerability Summary" >> "$OUTFILE"
            echo "" >> "$OUTFILE"

            if [ -f "grype-${SERVICE}.json" ]; then
              CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "grype-${SERVICE}.json")
              HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "grype-${SERVICE}.json")
              MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' "grype-${SERVICE}.json")
              LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' "grype-${SERVICE}.json")
              NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' "grype-${SERVICE}.json")
              TOTAL=$(jq '.matches | length' "grype-${SERVICE}.json")

              echo "| Severity | Count |" >> "$OUTFILE"
              echo "|----------|-------|" >> "$OUTFILE"
              echo "| \$\\color{red}{\\textsf{Critical}}\$ | ${CRITICAL} |" >> "$OUTFILE"
              echo "| \$\\color{orange}{\\textsf{High}}\$ | ${HIGH} |" >> "$OUTFILE"
              echo "| \$\\color{gold}{\\textsf{Medium}}\$ | ${MEDIUM} |" >> "$OUTFILE"
              echo "| \$\\color{green}{\\textsf{Low}}\$ | ${LOW} |" >> "$OUTFILE"
              echo "| \$\\color{gray}{\\textsf{Negligible}}\$ | ${NEGLIGIBLE} |" >> "$OUTFILE"
              echo "| **Total** | **${TOTAL}** |" >> "$OUTFILE"
              echo "" >> "$OUTFILE"

              if [ "$TOTAL" -gt 0 ]; then
                echo "## Detailed Findings" >> "$OUTFILE"
                echo "" >> "$OUTFILE"
                echo "| Severity | Package | Version | Vulnerability | Fixed In |" >> "$OUTFILE"
                echo "|----------|---------|---------|---------------|----------|" >> "$OUTFILE"

                jq -r '.matches | sort_by(
                  if .vulnerability.severity == "Critical" then 0
                  elif .vulnerability.severity == "High" then 1
                  elif .vulnerability.severity == "Medium" then 2
                  elif .vulnerability.severity == "Low" then 3
                  else 4 end
                )[:50][] |
                  if .vulnerability.severity == "Critical" then "| 🔴 Critical"
                  elif .vulnerability.severity == "High" then "| 🟠 High"
                  elif .vulnerability.severity == "Medium" then "| 🟡 Medium"
                  elif .vulnerability.severity == "Low" then "| 🟢 Low"
                  else "| ⚪ Negligible" end +
                  " | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.fix.versions[0] // "N/A") |"' "grype-${SERVICE}.json" >> "$OUTFILE"

                if [ "$TOTAL" -gt 50 ]; then
                  echo "" >> "$OUTFILE"
                  echo "*Showing top 50 of ${TOTAL} vulnerabilities (sorted by severity)*" >> "$OUTFILE"
                fi
              else
                echo "✅ No vulnerabilities found." >> "$OUTFILE"
              fi
            fi

            echo "Generated report for $SERVICE"

            # Clean up to free disk space
            if [ "$USE_REGISTRY_SCAN" = true ]; then
              echo "Registry scan used - no local image to remove"
            else
              docker rmi "$IMAGE" 2>/dev/null || true
              echo "Removed local image $IMAGE to free disk space"
            fi
            rm -f "grype-${SERVICE}.json" 2>/dev/null || true
          done

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-external-images
          path: docs/security-scans/*.md
          retention-days: 90

  commit-scan-results:
    runs-on: ubuntu-latest
    needs: [build-and-push, scan-external-images]
    if: github.event_name != 'pull_request' && always() && (needs.build-and-push.result == 'success' || needs.scan-external-images.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: scan-artifacts
          merge-multiple: false

      - name: Move scan results to docs folder
        run: |
          mkdir -p docs/security-scans
          for dir in scan-artifacts/scan-*; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.md docs/security-scans/ 2>/dev/null || true
            fi
          done
          ls -la docs/security-scans/

      - name: Generate summary README
        run: |
          SCAN_DATE=$(date -u '+%Y-%m-%d')
          OUTFILE="docs/security-scans/README.md"

          # Initialize counters
          TOTAL_CRITICAL=0
          TOTAL_HIGH=0
          TOTAL_MEDIUM=0
          TOTAL_LOW=0
          TOTAL_NEGLIGIBLE=0

          cat > "$OUTFILE" << 'HEADER'
          # Security Scan Results

          This directory contains vulnerability scan results for all container images in the RAG Knowledge Base application.

          Scans are automatically generated by the CI/CD pipeline using [Grype](https://github.com/anchore/grype).

          HEADER

          sed -i 's/^          //' "$OUTFILE"

          echo "## Summary" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Image | Size | Scan Date | Critical | High | Medium | Low | Negligible | Total |" >> "$OUTFILE"
          echo "|-------|------|-----------|----------|------|--------|-----|------------|-------|" >> "$OUTFILE"

          # Process each scan report
          for report in docs/security-scans/*.md; do
            if [ "$(basename "$report")" != "README.md" ]; then
              SERVICE=$(basename "$report" .md)

              # Extract counts from the Vulnerability Summary section
              # Using awk to get the specific section and then extract values
              CRITICAL=$(awk '/## Vulnerability Summary/,/## Detailed Findings/ {print}' "$report" | grep "Critical" | grep -oE '\| [0-9]+ \|' | grep -oE '[0-9]+' | head -1 || echo "0")
              HIGH=$(awk '/## Vulnerability Summary/,/## Detailed Findings/ {print}' "$report" | grep "High" | grep -oE '\| [0-9]+ \|' | grep -oE '[0-9]+' | head -1 || echo "0")
              MEDIUM=$(awk '/## Vulnerability Summary/,/## Detailed Findings/ {print}' "$report" | grep "Medium" | grep -oE '\| [0-9]+ \|' | grep -oE '[0-9]+' | head -1 || echo "0")
              LOW=$(awk '/## Vulnerability Summary/,/## Detailed Findings/ {print}' "$report" | grep "Low" | grep -oE '\| [0-9]+ \|' | grep -oE '[0-9]+' | head -1 || echo "0")
              NEGLIGIBLE=$(awk '/## Vulnerability Summary/,/## Detailed Findings/ {print}' "$report" | grep "Negligible" | grep -oE '\| [0-9]+ \|' | grep -oE '[0-9]+' | head -1 || echo "0")

              # Extract size and scan date from Image Details section
              SIZE=$(grep "| \*\*Size\*\*" "$report" | sed 's/.*| \(.*\) |/\1/' | xargs || echo "N/A")
              REPORT_SCAN_DATE=$(grep "| \*\*Scan Date\*\*" "$report" | sed 's/.*| \(.*\) UTC.*/\1/' | xargs || echo "N/A")

              REPORT_TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW + NEGLIGIBLE))

              TOTAL_CRITICAL=$((TOTAL_CRITICAL + CRITICAL))
              TOTAL_HIGH=$((TOTAL_HIGH + HIGH))
              TOTAL_MEDIUM=$((TOTAL_MEDIUM + MEDIUM))
              TOTAL_LOW=$((TOTAL_LOW + LOW))
              TOTAL_NEGLIGIBLE=$((TOTAL_NEGLIGIBLE + NEGLIGIBLE))

              echo "| [${SERVICE}](./${SERVICE}.md) | ${SIZE} | ${REPORT_SCAN_DATE} | ${CRITICAL} | ${HIGH} | ${MEDIUM} | ${LOW} | ${NEGLIGIBLE} | ${REPORT_TOTAL} |" >> "$OUTFILE"
            fi
          done

          GRAND_TOTAL=$((TOTAL_CRITICAL + TOTAL_HIGH + TOTAL_MEDIUM + TOTAL_LOW + TOTAL_NEGLIGIBLE))

          echo "| **TOTAL** | - | - | **${TOTAL_CRITICAL}** | **${TOTAL_HIGH}** | **${TOTAL_MEDIUM}** | **${TOTAL_LOW}** | **${TOTAL_NEGLIGIBLE}** | **${GRAND_TOTAL}** |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"

          echo "### Vulnerability Totals by Severity" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Severity | Count |" >> "$OUTFILE"
          echo "|----------|-------|" >> "$OUTFILE"
          echo "| 🔴 Critical | ${TOTAL_CRITICAL} |" >> "$OUTFILE"
          echo "| 🟠 High | ${TOTAL_HIGH} |" >> "$OUTFILE"
          echo "| 🟡 Medium | ${TOTAL_MEDIUM} |" >> "$OUTFILE"
          echo "| 🟢 Low | ${TOTAL_LOW} |" >> "$OUTFILE"
          echo "| ⚪ Negligible | ${TOTAL_NEGLIGIBLE} |" >> "$OUTFILE"
          echo "| **Total** | **${GRAND_TOTAL}** |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"

          echo "---" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "**Last Updated:** ${SCAN_DATE}" >> "$OUTFILE"
          echo "" >> "$OUTFILE"

          echo "## Scan Reports" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "### Custom Built Images" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Service | Scan Report |" >> "$OUTFILE"
          echo "|---------|-------------|" >> "$OUTFILE"
          for service in nginx frontend api-gateway document-processor embedding-service llm-service; do
            if [ -f "docs/security-scans/${service}.md" ]; then
              echo "| ${service} | [${service}.md](./${service}.md) |" >> "$OUTFILE"
            fi
          done
          echo "" >> "$OUTFILE"

          echo "### External Images" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Service | Image Source | Scan Report |" >> "$OUTFILE"
          echo "|---------|--------------|-------------|" >> "$OUTFILE"

          # Dynamically add external images
          for report in docs/security-scans/*.md; do
            SERVICE=$(basename "$report" .md)
            # Skip custom built images and README
            if [[ ! " nginx frontend api-gateway document-processor embedding-service llm-service README " =~ " ${SERVICE} " ]]; then
              # Check if it's a Chainguard image
              if grep -q "Chainguard" "$report"; then
                SOURCE="Chainguard Images"
              else
                SOURCE="Official"
              fi
              echo "| ${SERVICE} | ${SOURCE} | [${SERVICE}.md](./${SERVICE}.md) |" >> "$OUTFILE"
            fi
          done

          echo "" >> "$OUTFILE"
          echo "> **Note**: OpenSearch, PostgreSQL, and Redis use [Chainguard Images](https://www.chainguard.dev/) (\`cgr.dev/mikeco.com/*\`), which are hardened, distroless containers with minimal to zero CVEs. These images significantly reduce the attack surface compared to standard images." >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Update Frequency" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "Scan results are updated automatically on every push to \`original\` or \`chainguard\` branches and weekly via scheduled scans." >> "$OUTFILE"

      - name: Commit and push scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/security-scans/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update security scan results [skip ci]"
            # Pull with rebase to avoid conflicts if remote has moved ahead
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
