name: Build and Push Images to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        include:
          - service: nginx
            context: ./services/nginx
            dockerfile: ./services/nginx/Dockerfile
          - service: frontend
            context: ./services/frontend
            dockerfile: ./services/frontend/Dockerfile
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - service: document-processor
            context: ./services/document-processor
            dockerfile: ./services/document-processor/Dockerfile
          - service: embedding-service
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile.cpu
          - service: embedding-service-gpu
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile
          - service: llm-service
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile.cpu
          - service: llm-service-gpu
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' ${{ matrix.service }}:scan)
          echo "sha=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Run Grype vulnerability scan
        uses: anchore/scan-action@v4
        with:
          image: ${{ matrix.service }}:scan
          fail-build: false
          output-format: json
          output-file: grype-results.json

      - name: Generate scan report
        run: |
          mkdir -p docs/security-scans
          
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          IMAGE_SHA="${{ steps.digest.outputs.sha }}"
          
          # Start the markdown file
          echo "# ${{ matrix.service }}" > docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "Container image for the **${{ matrix.service }}** service." >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "## Image Details" >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "| Property | Value |" >> docs/security-scans/${{ matrix.service }}.md
          echo "|----------|-------|" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Image** | \`${IMAGE_NAME}\` |" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Digest** | \`${IMAGE_SHA}\` |" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Scan Date** | ${SCAN_DATE} |" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Scanner** | Grype |" >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "## Vulnerability Summary" >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          
          if [ -f grype-results.json ]; then
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            echo "| Severity | Count |" >> docs/security-scans/${{ matrix.service }}.md
            echo "|----------|-------|" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🔴 Critical | ${CRITICAL} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🟠 High | ${HIGH} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🟡 Medium | ${MEDIUM} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🟢 Low | ${LOW} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| ⚪ Negligible | ${NEGLIGIBLE} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| **Total** | **${TOTAL}** |" >> docs/security-scans/${{ matrix.service }}.md
            echo "" >> docs/security-scans/${{ matrix.service }}.md
            
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Detailed Findings" >> docs/security-scans/${{ matrix.service }}.md
              echo "" >> docs/security-scans/${{ matrix.service }}.md
              echo "| Package | Version | Vulnerability | Severity | Fixed In |" >> docs/security-scans/${{ matrix.service }}.md
              echo "|---------|---------|---------------|----------|----------|" >> docs/security-scans/${{ matrix.service }}.md
              jq -r '.matches[:50][] | "| \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> docs/security-scans/${{ matrix.service }}.md
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> docs/security-scans/${{ matrix.service }}.md
                echo "*Showing top 50 of ${TOTAL} vulnerabilities*" >> docs/security-scans/${{ matrix.service }}.md
              fi
            else
              echo "✅ **No vulnerabilities found!**" >> docs/security-scans/${{ matrix.service }}.md
            fi
          fi

      - name: Add scan results to job summary
        run: cat docs/security-scans/${{ matrix.service }}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: docs/security-scans/${{ matrix.service }}.md
          retention-days: 90

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit scan results
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add docs/security-scans/${{ matrix.service }}.md
          git diff --staged --quiet || git commit -m "Update security scan for ${{ matrix.service }} [skip ci]"
          git push || echo "Push failed, will retry in next job"

  mirror-external-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        include:
          - service: opensearch
            source_image: opensearchproject/opensearch:2.11.0
            tag: "2.11.0"
          - service: postgresql
            source_image: postgres:16-bookworm
            tag: "16-bookworm"
          - service: redis
            source_image: redis:7-bookworm
            tag: "7-bookworm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull external image
        run: docker pull ${{ matrix.source_image }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ matrix.source_image }})
          echo "sha=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Run Grype vulnerability scan
        uses: anchore/scan-action@v4
        with:
          image: ${{ matrix.source_image }}
          fail-build: false
          output-format: json
          output-file: grype-results.json

      - name: Generate scan report
        run: |
          mkdir -p docs/security-scans
          
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          SOURCE_IMAGE="${{ matrix.source_image }}"
          IMAGE_SHA="${{ steps.digest.outputs.sha }}"
          
          echo "# ${{ matrix.service }}" > docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "Mirrored container image for the **${{ matrix.service }}** service." >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "## Image Details" >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "| Property | Value |" >> docs/security-scans/${{ matrix.service }}.md
          echo "|----------|-------|" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Source Image** | \`${SOURCE_IMAGE}\` |" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **GHCR Image** | \`${IMAGE_NAME}\` |" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Digest** | \`${IMAGE_SHA}\` |" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Scan Date** | ${SCAN_DATE} |" >> docs/security-scans/${{ matrix.service }}.md
          echo "| **Scanner** | Grype |" >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          echo "## Vulnerability Summary" >> docs/security-scans/${{ matrix.service }}.md
          echo "" >> docs/security-scans/${{ matrix.service }}.md
          
          if [ -f grype-results.json ]; then
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            echo "| Severity | Count |" >> docs/security-scans/${{ matrix.service }}.md
            echo "|----------|-------|" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🔴 Critical | ${CRITICAL} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🟠 High | ${HIGH} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🟡 Medium | ${MEDIUM} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| 🟢 Low | ${LOW} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| ⚪ Negligible | ${NEGLIGIBLE} |" >> docs/security-scans/${{ matrix.service }}.md
            echo "| **Total** | **${TOTAL}** |" >> docs/security-scans/${{ matrix.service }}.md
            echo "" >> docs/security-scans/${{ matrix.service }}.md
            
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Detailed Findings" >> docs/security-scans/${{ matrix.service }}.md
              echo "" >> docs/security-scans/${{ matrix.service }}.md
              echo "| Package | Version | Vulnerability | Severity | Fixed In |" >> docs/security-scans/${{ matrix.service }}.md
              echo "|---------|---------|---------------|----------|----------|" >> docs/security-scans/${{ matrix.service }}.md
              jq -r '.matches[:50][] | "| \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> docs/security-scans/${{ matrix.service }}.md
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> docs/security-scans/${{ matrix.service }}.md
                echo "*Showing top 50 of ${TOTAL} vulnerabilities*" >> docs/security-scans/${{ matrix.service }}.md
              fi
            else
              echo "✅ **No vulnerabilities found!**" >> docs/security-scans/${{ matrix.service }}.md
            fi
          fi

      - name: Add scan results to job summary
        run: cat docs/security-scans/${{ matrix.service }}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: docs/security-scans/${{ matrix.service }}.md
          retention-days: 90

      - name: Tag and push to GHCR
        run: |
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add docs/security-scans/${{ matrix.service }}.md
          git diff --staged --quiet || git commit -m "Update security scan for ${{ matrix.service }} [skip ci]"
          git push || echo "Push failed, will retry in next job"
