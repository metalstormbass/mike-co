name: Build and Push Images to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: nginx
            context: ./services/nginx
            dockerfile: ./services/nginx/Dockerfile
          - service: frontend
            context: ./services/frontend
            dockerfile: ./services/frontend/Dockerfile
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - service: document-processor
            context: ./services/document-processor
            dockerfile: ./services/document-processor/Dockerfile
          - service: embedding-service
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile.cpu
          - service: embedding-service-gpu
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile
          - service: llm-service
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile.cpu
          - service: llm-service-gpu
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' ${{ matrix.service }}:scan)
          echo "sha=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype vulnerability scan
        run: |
          grype ${{ matrix.service }}:scan -o json > grype-results.json || true

      - name: Generate scan report
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_SHA: ${{ steps.digest.outputs.sha }}
        run: |
          mkdir -p docs/security-scans
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}"
          OUTFILE="docs/security-scans/${SERVICE}.md"
          
          echo "# ${SERVICE}" > "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "Container image for the **${SERVICE}** service." >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Image Details" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Property | Value |" >> "$OUTFILE"
          echo "|----------|-------|" >> "$OUTFILE"
          echo "| **Image** | \`${IMAGE_NAME}\` |" >> "$OUTFILE"
          echo "| **Digest** | \`${IMAGE_SHA}\` |" >> "$OUTFILE"
          echo "| **Scan Date** | ${SCAN_DATE} |" >> "$OUTFILE"
          echo "| **Scanner** | Grype |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Vulnerability Summary" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          
          if [ -f grype-results.json ]; then
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            echo "| Severity | Count |" >> "$OUTFILE"
            echo "|----------|-------|" >> "$OUTFILE"
            echo "| Critical | ${CRITICAL} |" >> "$OUTFILE"
            echo "| High | ${HIGH} |" >> "$OUTFILE"
            echo "| Medium | ${MEDIUM} |" >> "$OUTFILE"
            echo "| Low | ${LOW} |" >> "$OUTFILE"
            echo "| Negligible | ${NEGLIGIBLE} |" >> "$OUTFILE"
            echo "| **Total** | **${TOTAL}** |" >> "$OUTFILE"
            echo "" >> "$OUTFILE"
            
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Detailed Findings" >> "$OUTFILE"
              echo "" >> "$OUTFILE"
              echo "| Package | Version | Vulnerability | Severity | Fixed In |" >> "$OUTFILE"
              echo "|---------|---------|---------------|----------|----------|" >> "$OUTFILE"
              jq -r '.matches[:50][] | "| \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> "$OUTFILE"
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> "$OUTFILE"
                echo "*Showing top 50 of ${TOTAL} vulnerabilities*" >> "$OUTFILE"
              fi
            else
              echo "No vulnerabilities found." >> "$OUTFILE"
            fi
          fi

      - name: Add scan results to job summary
        run: cat docs/security-scans/${{ matrix.service }}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: docs/security-scans/${{ matrix.service }}.md
          retention-days: 90

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mirror-external-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        include:
          - service: opensearch
            source_image: opensearchproject/opensearch:2.11.0
            tag: "2.11.0"
          - service: postgresql
            source_image: postgres:16-bookworm
            tag: "16-bookworm"
          - service: redis
            source_image: redis:7-bookworm
            tag: "7-bookworm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull external image
        run: docker pull ${{ matrix.source_image }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ matrix.source_image }})
          echo "sha=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype vulnerability scan
        run: |
          grype ${{ matrix.source_image }} -o json > grype-results.json || true

      - name: Generate scan report
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_IMAGE: ${{ matrix.source_image }}
          IMAGE_SHA: ${{ steps.digest.outputs.sha }}
        run: |
          mkdir -p docs/security-scans
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}"
          OUTFILE="docs/security-scans/${SERVICE}.md"
          
          echo "# ${SERVICE}" > "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "Mirrored container image for the **${SERVICE}** service." >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Image Details" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "| Property | Value |" >> "$OUTFILE"
          echo "|----------|-------|" >> "$OUTFILE"
          echo "| **Source Image** | \`${SOURCE_IMAGE}\` |" >> "$OUTFILE"
          echo "| **GHCR Image** | \`${IMAGE_NAME}\` |" >> "$OUTFILE"
          echo "| **Digest** | \`${IMAGE_SHA}\` |" >> "$OUTFILE"
          echo "| **Scan Date** | ${SCAN_DATE} |" >> "$OUTFILE"
          echo "| **Scanner** | Grype |" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          echo "## Vulnerability Summary" >> "$OUTFILE"
          echo "" >> "$OUTFILE"
          
          if [ -f grype-results.json ]; then
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            echo "| Severity | Count |" >> "$OUTFILE"
            echo "|----------|-------|" >> "$OUTFILE"
            echo "| Critical | ${CRITICAL} |" >> "$OUTFILE"
            echo "| High | ${HIGH} |" >> "$OUTFILE"
            echo "| Medium | ${MEDIUM} |" >> "$OUTFILE"
            echo "| Low | ${LOW} |" >> "$OUTFILE"
            echo "| Negligible | ${NEGLIGIBLE} |" >> "$OUTFILE"
            echo "| **Total** | **${TOTAL}** |" >> "$OUTFILE"
            echo "" >> "$OUTFILE"
            
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Detailed Findings" >> "$OUTFILE"
              echo "" >> "$OUTFILE"
              echo "| Package | Version | Vulnerability | Severity | Fixed In |" >> "$OUTFILE"
              echo "|---------|---------|---------------|----------|----------|" >> "$OUTFILE"
              jq -r '.matches[:50][] | "| \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> "$OUTFILE"
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> "$OUTFILE"
                echo "*Showing top 50 of ${TOTAL} vulnerabilities*" >> "$OUTFILE"
              fi
            else
              echo "No vulnerabilities found." >> "$OUTFILE"
            fi
          fi

      - name: Add scan results to job summary
        run: cat docs/security-scans/${{ matrix.service }}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: docs/security-scans/${{ matrix.service }}.md
          retention-days: 90

      - name: Tag and push to GHCR
        run: |
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  commit-scan-results:
    runs-on: ubuntu-latest
    needs: [build-and-push, mirror-external-images]
    if: github.event_name != 'pull_request' && always() && (needs.build-and-push.result == 'success' || needs.mirror-external-images.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: scan-artifacts
          merge-multiple: false

      - name: Move scan results to docs folder
        run: |
          mkdir -p docs/security-scans
          for dir in scan-artifacts/scan-*; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.md docs/security-scans/
            fi
          done
          ls -la docs/security-scans/

      - name: Commit and push scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/security-scans/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update security scan results [skip ci]"
            git push
          fi
