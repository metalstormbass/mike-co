name: Build and Push Images to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: nginx
            context: ./services/nginx
            dockerfile: ./services/nginx/Dockerfile
          - service: frontend
            context: ./services/frontend
            dockerfile: ./services/frontend/Dockerfile
          - service: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - service: document-processor
            context: ./services/document-processor
            dockerfile: ./services/document-processor/Dockerfile
          - service: embedding-service
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile.cpu
          - service: embedding-service-gpu
            context: ./services/embedding-service
            dockerfile: ./services/embedding-service/Dockerfile
          - service: llm-service
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile.cpu
          - service: llm-service-gpu
            context: ./services/llm-service
            dockerfile: ./services/llm-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ matrix.service }}:scan 2>/dev/null || docker inspect --format='{{.Id}}' ${{ matrix.service }}:scan)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo $DIGEST | cut -d':' -f2 | head -c 12)" >> $GITHUB_OUTPUT

      - name: Run Grype vulnerability scan
        id: grype
        uses: anchore/scan-action@v4
        with:
          image: ${{ matrix.service }}:scan
          fail-build: false
          output-format: json
          output-file: grype-results.json

      - name: Generate scan summary
        id: scan-summary
        run: |
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          IMAGE_SHA="${{ steps.digest.outputs.short_sha }}"
          
          cat << EOF > package-readme.md
          # ${{ matrix.service }}

          Container image for the **${{ matrix.service }}** service in the RAG Knowledge Base application.

          ## Usage

          \`\`\`bash
          docker pull ${IMAGE_NAME}:latest
          \`\`\`

          ---

          ## Vulnerability Scan Results

          | Property | Value |
          |----------|-------|
          | **Image** | \`${IMAGE_NAME}\` |
          | **Digest** | \`sha256:${IMAGE_SHA}...\` |
          | **Scan Date** | ${SCAN_DATE} |
          | **Scanner** | Grype |

          ### Vulnerability Summary

          EOF
          
          # Parse JSON and create vulnerability table
          if [ -f grype-results.json ]; then
            # Count vulnerabilities by severity
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            cat << EOF >> package-readme.md
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${CRITICAL} |
          | 🟠 High | ${HIGH} |
          | 🟡 Medium | ${MEDIUM} |
          | 🟢 Low | ${LOW} |
          | ⚪ Negligible | ${NEGLIGIBLE} |
          | **Total** | **${TOTAL}** |

          EOF
            
            if [ "$TOTAL" -gt 0 ]; then
              cat << EOF >> package-readme.md
          ### Detailed Findings

          | Package | Version | Vulnerability | Severity | Fixed In |
          |---------|---------|---------------|----------|----------|
          EOF
              
              # Extract top 50 vulnerabilities and format as table
              jq -r '.matches[:50][] | "| \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> package-readme.md
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> package-readme.md
                echo "*Showing top 50 of ${TOTAL} vulnerabilities*" >> package-readme.md
              fi
            else
              echo "✅ **No vulnerabilities found!**" >> package-readme.md
            fi
          else
            echo "⚠️ Scan results not available" >> package-readme.md
          fi

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update package README with scan results
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Update the package README via GitHub API
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${{ github.event.repository.name }}%2F${{ matrix.service }}" \
            -d "{\"description\":\"${{ matrix.service }} container image with vulnerability scan results\",\"readme\":$(cat package-readme.md | jq -Rs .)}" || echo "Package README update skipped (package may not exist yet)"

  # Pull, scan, and push external images to GHCR
  mirror-external-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        include:
          - service: opensearch
            source_image: opensearchproject/opensearch:2.11.0
            tag: "2.11.0"
          - service: postgresql
            source_image: postgres:16-bookworm
            tag: "16-bookworm"
          - service: redis
            source_image: redis:7-bookworm
            tag: "7-bookworm"

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull external image
        run: docker pull ${{ matrix.source_image }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ matrix.source_image }} 2>/dev/null || docker inspect --format='{{.Id}}' ${{ matrix.source_image }})
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo $DIGEST | cut -d':' -f2 | head -c 12)" >> $GITHUB_OUTPUT

      - name: Run Grype vulnerability scan
        id: grype
        uses: anchore/scan-action@v4
        with:
          image: ${{ matrix.source_image }}
          fail-build: false
          output-format: json
          output-file: grype-results.json

      - name: Generate scan summary
        id: scan-summary
        run: |
          SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          SOURCE_IMAGE="${{ matrix.source_image }}"
          IMAGE_SHA="${{ steps.digest.outputs.short_sha }}"
          
          cat << EOF > package-readme.md
          # ${{ matrix.service }}

          Mirrored container image for the **${{ matrix.service }}** service in the RAG Knowledge Base application.

          ## Usage

          \`\`\`bash
          docker pull ${IMAGE_NAME}:latest
          \`\`\`

          ---

          ## Vulnerability Scan Results

          | Property | Value |
          |----------|-------|
          | **Source Image** | \`${SOURCE_IMAGE}\` |
          | **GHCR Image** | \`${IMAGE_NAME}\` |
          | **Digest** | \`sha256:${IMAGE_SHA}...\` |
          | **Scan Date** | ${SCAN_DATE} |
          | **Scanner** | Grype |

          ### Vulnerability Summary

          EOF
          
          # Parse JSON and create vulnerability table
          if [ -f grype-results.json ]; then
            # Count vulnerabilities by severity
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
            NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' grype-results.json)
            TOTAL=$(jq '.matches | length' grype-results.json)
            
            cat << EOF >> package-readme.md
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${CRITICAL} |
          | 🟠 High | ${HIGH} |
          | 🟡 Medium | ${MEDIUM} |
          | 🟢 Low | ${LOW} |
          | ⚪ Negligible | ${NEGLIGIBLE} |
          | **Total** | **${TOTAL}** |

          EOF
            
            if [ "$TOTAL" -gt 0 ]; then
              cat << EOF >> package-readme.md
          ### Detailed Findings

          | Package | Version | Vulnerability | Severity | Fixed In |
          |---------|---------|---------------|----------|----------|
          EOF
              
              # Extract top 50 vulnerabilities and format as table
              jq -r '.matches[:50][] | "| \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(.vulnerability.fix.versions[0] // "N/A") |"' grype-results.json >> package-readme.md
              
              if [ "$TOTAL" -gt 50 ]; then
                echo "" >> package-readme.md
                echo "*Showing top 50 of ${TOTAL} vulnerabilities*" >> package-readme.md
              fi
            else
              echo "✅ **No vulnerabilities found!**" >> package-readme.md
            fi
          else
            echo "⚠️ Scan results not available" >> package-readme.md
          fi

      - name: Tag and push to GHCR
        run: |
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker tag ${{ matrix.source_image }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ matrix.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

      - name: Update package README with scan results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Update the package README via GitHub API
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${{ github.event.repository.name }}%2F${{ matrix.service }}" \
            -d "{\"description\":\"${{ matrix.service }} container image (mirrored) with vulnerability scan results\",\"readme\":$(cat package-readme.md | jq -Rs .)}" || echo "Package README update skipped (package may not exist yet)"

