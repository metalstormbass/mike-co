name: Security Scans

on:
  push:
    branches:
      - original
      - chainguard
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract images from docker-compose
        id: images
        run: |
          # Extract all image names from docker-compose.yaml
          IMAGES=$(yq eval '.services.*.image' docker-compose.yaml | sort -u)

          # Convert to JSON array
          IMAGE_ARRAY=$(echo "$IMAGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "images=$IMAGE_ARRAY" >> $GITHUB_OUTPUT
          echo "Found images:"
          echo "$IMAGES"

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y

          # Clean Docker
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h

      - name: Authenticate with Chainguard
        env:
          CG_U: ${{ secrets.CG_U }}
          CG_P: ${{ secrets.CG_P }}
        run: |
          if [ -n "${CG_U}" ] && [ -n "${CG_P}" ]; then
            echo "Authenticating with Chainguard..."
            echo "${CG_P}" | docker login cgr.dev --username "${CG_U}" --password-stdin
            echo "Successfully authenticated with Chainguard"
          else
            echo "Warning: CG_U or CG_P not set, some images may not be accessible"
          fi

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/*.sh

      - name: Scan images
        env:
          IMAGES: ${{ steps.images.outputs.images }}
          BRANCH_NAME: ${{ github.ref_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p scan-results
          mkdir -p scan-results/scans

          # Parse JSON array
          IMAGE_LIST=$(echo "$IMAGES" | jq -r '.[]')

          # Track scan data
          SCAN_DATA_FILE="scan-results/summary-data.txt"
          > "$SCAN_DATA_FILE"

          for IMAGE in $IMAGE_LIST; do
            echo "=================================================="
            echo "Scanning: $IMAGE"
            echo "=================================================="

            # Pull image
            if ! docker pull "$IMAGE" 2>&1; then
              echo "Failed to pull $IMAGE, skipping..."
              continue
            fi

            # Get image details
            IMAGE_SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)
            IMAGE_ID=$(docker images "$IMAGE" --format "{{.ID}}" | head -1)

            # Generate safe filename
            SAFE_NAME=$(echo "$IMAGE" | sed 's/[^a-zA-Z0-9._-]/_/g')

            # Run Grype scan
            echo "Running Grype scan..."
            TMPDIR="${GITHUB_WORKSPACE}/tmp"
            mkdir -p "$TMPDIR"

            grype "$IMAGE" -o json > "scan-results/${SAFE_NAME}.json" || true

            rm -rf "$TMPDIR"

            # Generate HTML report and get scan data
            SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            SCAN_DATA=$(.github/scripts/generate-scan-report.sh \
              "scan-results/${SAFE_NAME}.json" \
              "scan-results/scans/${SAFE_NAME}.html" \
              "$IMAGE" \
              "$IMAGE_SIZE" \
              "$SCAN_DATE" \
              "$WORKFLOW_URL")

            echo "$SCAN_DATA" >> "$SCAN_DATA_FILE"

            # Aggressive cleanup
            echo "Cleaning up..."
            docker rmi "$IMAGE" || true
            docker system prune -af --volumes

            echo "Disk space after cleanup:"
            df -h
            echo ""
          done

      - name: Generate summary page
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          .github/scripts/generate-summary.sh \
            "scan-results/summary-data.txt" \
            "scan-results/index.html" \
            "$BRANCH_NAME"

      - name: Prepare GitHub Pages deployment
        run: |
          mkdir -p gh-pages/${{ github.ref_name }}
          mkdir -p gh-pages/${{ github.ref_name }}/scans

          # Copy HTML files
          cp scan-results/index.html gh-pages/${{ github.ref_name }}/
          cp scan-results/scans/*.html gh-pages/${{ github.ref_name }}/scans/ 2>/dev/null || true

          # Create main index if it doesn't exist
          if [ ! -f gh-pages/index.html ]; then
            .github/scripts/generate-main-index.sh gh-pages/index.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/original' || github.ref == 'refs/heads/chainguard'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
          destination_dir: .
