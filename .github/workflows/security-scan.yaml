name: Security Scans

on:
  push:
    branches:
      - original
      - chainguard
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: security-scan
  cancel-in-progress: true

jobs:
  # Scan original branch images
  scan-original:
    name: Scan Original Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original branch
        uses: actions/checkout@v4
        with:
          ref: original

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract services from docker-compose
        id: services
        run: |
          # Get list of all services
          SERVICES=$(yq eval '.services | keys | .[]' docker-compose.yaml)

          # Arrays to track services that need building vs pre-built images
          BUILD_SERVICES=()
          PREBUILT_IMAGES=()

          for SERVICE in $SERVICES; do
            # Check if service has build directive
            HAS_BUILD=$(yq eval ".services.${SERVICE} | has(\"build\")" docker-compose.yaml)

            if [ "$HAS_BUILD" = "true" ]; then
              BUILD_SERVICES+=("$SERVICE")
              echo "Service '$SERVICE' needs building"
            else
              # Get the image name
              IMAGE=$(yq eval ".services.${SERVICE}.image" docker-compose.yaml)
              if [ "$IMAGE" != "null" ]; then
                PREBUILT_IMAGES+=("$IMAGE")
                echo "Service '$SERVICE' uses pre-built image: $IMAGE"
              fi
            fi
          done

          # Convert to JSON arrays
          BUILD_SERVICES_JSON=$(printf '%s\n' "${BUILD_SERVICES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          PREBUILT_IMAGES_JSON=$(printf '%s\n' "${PREBUILT_IMAGES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "build_services=$BUILD_SERVICES_JSON" >> $GITHUB_OUTPUT
          echo "prebuilt_images=$PREBUILT_IMAGES_JSON" >> $GITHUB_OUTPUT

          echo "Services to build: ${BUILD_SERVICES[@]}"
          echo "Pre-built images: ${PREBUILT_IMAGES[@]}"

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y

          # Clean Docker
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/*.sh

      - name: Build custom images
        env:
          BUILD_SERVICES: ${{ steps.services.outputs.build_services }}
        run: |
          # Parse JSON array of services to build
          SERVICES_TO_BUILD=$(echo "$BUILD_SERVICES" | jq -r '.[]')

          for SERVICE in $SERVICES_TO_BUILD; do
            echo "=================================================="
            echo "Building service: $SERVICE"
            echo "=================================================="

            # Get build context and dockerfile if specified
            BUILD_CONTEXT=$(yq eval ".services.${SERVICE}.build.context // .services.${SERVICE}.build" docker-compose.yaml)
            DOCKERFILE=$(yq eval ".services.${SERVICE}.build.dockerfile // \"Dockerfile\"" docker-compose.yaml)

            # Handle relative paths
            if [ "$BUILD_CONTEXT" = "null" ]; then
              BUILD_CONTEXT="./services/${SERVICE}"
            fi

            # Build the image and tag it as the service name for scanning
            echo "Building from context: $BUILD_CONTEXT with dockerfile: $DOCKERFILE"

            if [ "$DOCKERFILE" != "null" ] && [ "$DOCKERFILE" != "Dockerfile" ]; then
              docker build -t "${SERVICE}:scan" -f "${BUILD_CONTEXT}/${DOCKERFILE}" "$BUILD_CONTEXT"
            else
              docker build -t "${SERVICE}:scan" "$BUILD_CONTEXT"
            fi

            echo "Successfully built ${SERVICE}:scan"
            echo ""
          done

      - name: Scan images
        env:
          BUILD_SERVICES: ${{ steps.services.outputs.build_services }}
          PREBUILT_IMAGES: ${{ steps.services.outputs.prebuilt_images }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p scan-results
          mkdir -p scan-results/scans

          # Track scan data
          SCAN_DATA_FILE="scan-results/summary-data.txt"
          > "$SCAN_DATA_FILE"

          # Scan built images first
          SERVICES_TO_SCAN=$(echo "$BUILD_SERVICES" | jq -r '.[]')
          for SERVICE in $SERVICES_TO_SCAN; do
            IMAGE="${SERVICE}:scan"
            echo "=================================================="
            echo "Scanning built image: $IMAGE"
            echo "=================================================="

            # Get image details
            IMAGE_SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)

            # Generate safe filename
            SAFE_NAME=$(echo "$SERVICE" | sed 's/[^a-zA-Z0-9._-]/_/g')

            # Run Grype scan
            echo "Running Grype scan..."
            TMPDIR="${GITHUB_WORKSPACE}/tmp"
            mkdir -p "$TMPDIR"

            grype "$IMAGE" -o json > "scan-results/${SAFE_NAME}.json" || true

            rm -rf "$TMPDIR"

            # Append -cg to service name for Chainguard branch display
            DISPLAY_NAME="${SERVICE}-cg"

            # Generate HTML report and get scan data
            SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            SCAN_DATA=$(.github/scripts/generate-scan-report.sh \
              "scan-results/${SAFE_NAME}.json" \
              "scan-results/scans/${SAFE_NAME}.html" \
              "$DISPLAY_NAME" \
              "$IMAGE_SIZE" \
              "$SCAN_DATE" \
              "$WORKFLOW_URL")

            echo "$SCAN_DATA" >> "$SCAN_DATA_FILE"

            # Cleanup - only remove the scanned image, don't prune yet
            echo "Cleaning up scanned image..."
            docker rmi "$IMAGE" || true

            echo "Disk space after scan:"
            df -h
            echo ""
          done

          # Run system prune after all built images are scanned
          echo "Running cleanup after built images..."
          docker system prune -af --volumes

          # Scan pre-built images
          PREBUILT_TO_SCAN=$(echo "$PREBUILT_IMAGES" | jq -r '.[]')
          for IMAGE in $PREBUILT_TO_SCAN; do
            echo "=================================================="
            echo "Scanning pre-built image: $IMAGE"
            echo "=================================================="

            # Pull image
            if ! docker pull "$IMAGE" 2>&1; then
              echo "Failed to pull $IMAGE, skipping..."
              continue
            fi

            # Get image details
            IMAGE_SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)

            # Generate safe filename
            SAFE_NAME=$(echo "$IMAGE" | sed 's/[^a-zA-Z0-9._-]/_/g')

            # Run Grype scan
            echo "Running Grype scan..."
            TMPDIR="${GITHUB_WORKSPACE}/tmp"
            mkdir -p "$TMPDIR"

            grype "$IMAGE" -o json > "scan-results/${SAFE_NAME}.json" || true

            rm -rf "$TMPDIR"

            # Append -cg to the image name for Chainguard branch display
            DISPLAY_IMAGE="${IMAGE}-cg"

            # Generate HTML report and get scan data
            SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            SCAN_DATA=$(.github/scripts/generate-scan-report.sh \
              "scan-results/${SAFE_NAME}.json" \
              "scan-results/scans/${SAFE_NAME}.html" \
              "$DISPLAY_IMAGE" \
              "$IMAGE_SIZE" \
              "$SCAN_DATE" \
              "$WORKFLOW_URL")

            echo "$SCAN_DATA" >> "$SCAN_DATA_FILE"

            # Cleanup after each prebuilt image
            echo "Cleaning up..."
            docker rmi "$IMAGE" || true
            docker system prune -af --volumes

            echo "Disk space after cleanup:"
            df -h
            echo ""
          done

      - name: Generate summary page and JSON
        run: |
          .github/scripts/generate-summary.sh \
            "scan-results/summary-data.txt" \
            "scan-results/index.html" \
            "original"

          # Convert summary data to JSON for easier consumption
          python3 << 'PYTHON_JSON'
          import json
          import sys

          scans = []
          with open('scan-results/summary-data.txt', 'r') as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split('|')
                  if len(parts) >= 9:
                      scans.append({
                          'image': parts[0],
                          'size': parts[1],
                          'scanDate': parts[2],
                          'critical': int(parts[3]),
                          'high': int(parts[4]),
                          'medium': int(parts[5]),
                          'low': int(parts[6]),
                          'negligible': int(parts[7]),
                          'total': int(parts[8])
                      })

          with open('scan-results/scan-results.json', 'w') as f:
              json.dump(scans, f, indent=2)

          print(f"Generated JSON with {len(scans)} scans", file=sys.stderr)
          PYTHON_JSON

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-original
          path: scan-results/
          retention-days: 7

      - name: Manage vulnerability issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Closing existing vulnerability issues ==="
          gh issue list --label "vulnerability,os-component" --state open --json number --jq '.[].number' | \
            xargs -I {} gh issue close {} --comment "Closing to regenerate from latest scan" || true

          echo ""
          echo "=== Analyzing scan results for OS vulnerabilities ==="

          python3 << 'PYTHON_ISSUES'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          scan_dir = Path('scan-results')
          os_vulnerabilities = []

          OS_TYPES = {'deb', 'dpkg', 'rpm', 'apk', 'alpm', 'portage', 'cab'}

          for scan_file in scan_dir.glob('*.json'):
              if scan_file.name == 'scan-results.json':
                  continue

              try:
                  with open(scan_file) as f:
                      data = json.load(f)

                  image_name = 'unknown'
                  if 'source' in data and 'target' in data['source']:
                      image_name = data['source']['target'].get('userInput', 'unknown')

                  matches = data.get('matches', [])
                  for match in matches:
                      artifact = match.get('artifact', {})
                      vulnerability = match.get('vulnerability', {})

                      pkg_type = artifact.get('type', '').lower()
                      if pkg_type not in OS_TYPES:
                          continue

                      severity = vulnerability.get('severity', '').upper()
                      if severity not in ['CRITICAL', 'HIGH']:
                          continue

                      os_vulnerabilities.append({
                          'image': image_name,
                          'package': artifact.get('name', 'unknown'),
                          'version': artifact.get('version', 'unknown'),
                          'vulnerability': vulnerability.get('id', 'unknown'),
                          'severity': severity,
                          'description': vulnerability.get('description', 'No description available'),
                          'fixed_in': vulnerability.get('fix', {}).get('versions', ['Not available'])[0] if vulnerability.get('fix', {}).get('versions') else 'Not available',
                          'urls': vulnerability.get('urls', [])
                      })
              except Exception as e:
                  print(f"Error processing {scan_file}: {e}", file=sys.stderr)
                  continue

          print(f"Found {len(os_vulnerabilities)} OS vulnerabilities (Critical/High)")

          issue_count = 0
          for vuln in os_vulnerabilities:
              vid = vuln['vulnerability']
              img = vuln['image']

              title = f"[{vuln['severity']}] {vid} in {vuln['package']} ({img})"

              body_parts = [
                  "## Vulnerability Details",
                  "",
                  f"**Vulnerability ID:** {vid}",
                  f"**Severity:** {vuln['severity']}",
                  f"**Package:** {vuln['package']}",
                  f"**Current Version:** {vuln['version']}",
                  f"**Fixed In:** {vuln['fixed_in']}",
                  f"**Affected Image:** `{img}`",
                  "",
                  "## Description",
                  "",
                  vuln['description'],
                  ""
              ]

              if vuln['urls']:
                  body_parts.append("## References")
                  body_parts.append("")
                  for url in vuln['urls'][:3]:
                      body_parts.append(f"- {url}")
                  body_parts.append("")

              body_parts.append("---")
              body_parts.append("*Auto-generated by security scan workflow*")

              body = "\n".join(body_parts)

              try:
                  result = subprocess.run(
                      ['gh', 'issue', 'create',
                       '--title', title,
                       '--body', body,
                       '--label', 'vulnerability,os-component'],
                      capture_output=True,
                      text=True,
                      check=True
                  )
                  print(f"✓ Created issue for {vid} in {img}")
                  issue_count += 1
              except subprocess.CalledProcessError as e:
                  print(f"✗ Failed to create issue for {vid} in {img}: {e.stderr}")

          print(f"\nCreated {issue_count} vulnerability issues")
          PYTHON_ISSUES

  # Scan chainguard branch images
  scan-chainguard:
    name: Scan Chainguard Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout chainguard branch
        uses: actions/checkout@v4
        with:
          ref: chainguard

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract services from docker-compose
        id: services
        run: |
          # Get list of all services
          SERVICES=$(yq eval '.services | keys | .[]' docker-compose.yaml)

          # Arrays to track services that need building vs pre-built images
          BUILD_SERVICES=()
          PREBUILT_IMAGES=()

          for SERVICE in $SERVICES; do
            # Check if service has build directive
            HAS_BUILD=$(yq eval ".services.${SERVICE} | has(\"build\")" docker-compose.yaml)

            if [ "$HAS_BUILD" = "true" ]; then
              BUILD_SERVICES+=("$SERVICE")
              echo "Service '$SERVICE' needs building"
            else
              # Get the image name
              IMAGE=$(yq eval ".services.${SERVICE}.image" docker-compose.yaml)
              if [ "$IMAGE" != "null" ]; then
                PREBUILT_IMAGES+=("$IMAGE")
                echo "Service '$SERVICE' uses pre-built image: $IMAGE"
              fi
            fi
          done

          # Convert to JSON arrays
          BUILD_SERVICES_JSON=$(printf '%s\n' "${BUILD_SERVICES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          PREBUILT_IMAGES_JSON=$(printf '%s\n' "${PREBUILT_IMAGES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "build_services=$BUILD_SERVICES_JSON" >> $GITHUB_OUTPUT
          echo "prebuilt_images=$PREBUILT_IMAGES_JSON" >> $GITHUB_OUTPUT

          echo "Services to build: ${BUILD_SERVICES[@]}"
          echo "Pre-built images: ${PREBUILT_IMAGES[@]}"

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y

          # Clean Docker
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h

      - name: Authenticate with Chainguard
        env:
          CG_U: ${{ secrets.CG_U }}
          CG_P: ${{ secrets.CG_P }}
        run: |
          if [ -n "${CG_U}" ] && [ -n "${CG_P}" ]; then
            echo "Authenticating with Chainguard..."
            echo "${CG_P}" | docker login cgr.dev --username "${CG_U}" --password-stdin
            echo "Successfully authenticated with Chainguard"
          else
            echo "Warning: CG_U or CG_P not set, some images may not be accessible"
          fi

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/*.sh

      - name: Build custom images
        env:
          BUILD_SERVICES: ${{ steps.services.outputs.build_services }}
        run: |
          # Parse JSON array of services to build
          SERVICES_TO_BUILD=$(echo "$BUILD_SERVICES" | jq -r '.[]')

          for SERVICE in $SERVICES_TO_BUILD; do
            echo "=================================================="
            echo "Building service: $SERVICE"
            echo "=================================================="

            # Get build context and dockerfile if specified
            BUILD_CONTEXT=$(yq eval ".services.${SERVICE}.build.context // .services.${SERVICE}.build" docker-compose.yaml)
            DOCKERFILE=$(yq eval ".services.${SERVICE}.build.dockerfile // \"Dockerfile\"" docker-compose.yaml)

            # Handle relative paths
            if [ "$BUILD_CONTEXT" = "null" ]; then
              BUILD_CONTEXT="./services/${SERVICE}"
            fi

            # Build the image and tag it as the service name for scanning
            echo "Building from context: $BUILD_CONTEXT with dockerfile: $DOCKERFILE"

            if [ "$DOCKERFILE" != "null" ] && [ "$DOCKERFILE" != "Dockerfile" ]; then
              docker build -t "${SERVICE}:scan" -f "${BUILD_CONTEXT}/${DOCKERFILE}" "$BUILD_CONTEXT"
            else
              docker build -t "${SERVICE}:scan" "$BUILD_CONTEXT"
            fi

            echo "Successfully built ${SERVICE}:scan"
            echo ""
          done

      - name: Scan images
        env:
          BUILD_SERVICES: ${{ steps.services.outputs.build_services }}
          PREBUILT_IMAGES: ${{ steps.services.outputs.prebuilt_images }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p scan-results
          mkdir -p scan-results/scans

          # Track scan data
          SCAN_DATA_FILE="scan-results/summary-data.txt"
          > "$SCAN_DATA_FILE"

          # Scan built images first
          SERVICES_TO_SCAN=$(echo "$BUILD_SERVICES" | jq -r '.[]')
          for SERVICE in $SERVICES_TO_SCAN; do
            IMAGE="${SERVICE}:scan"
            echo "=================================================="
            echo "Scanning built image: $IMAGE"
            echo "=================================================="

            # Get image details
            IMAGE_SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)

            # Generate safe filename
            SAFE_NAME=$(echo "$SERVICE" | sed 's/[^a-zA-Z0-9._-]/_/g')

            # Run Grype scan
            echo "Running Grype scan..."
            TMPDIR="${GITHUB_WORKSPACE}/tmp"
            mkdir -p "$TMPDIR"

            grype "$IMAGE" -o json > "scan-results/${SAFE_NAME}.json" || true

            rm -rf "$TMPDIR"

            # Append -cg to service name for Chainguard branch display
            DISPLAY_NAME="${SERVICE}-cg"

            # Generate HTML report and get scan data
            SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            SCAN_DATA=$(.github/scripts/generate-scan-report.sh \
              "scan-results/${SAFE_NAME}.json" \
              "scan-results/scans/${SAFE_NAME}.html" \
              "$DISPLAY_NAME" \
              "$IMAGE_SIZE" \
              "$SCAN_DATE" \
              "$WORKFLOW_URL")

            echo "$SCAN_DATA" >> "$SCAN_DATA_FILE"

            # Cleanup - only remove the scanned image, don't prune yet
            echo "Cleaning up scanned image..."
            docker rmi "$IMAGE" || true

            echo "Disk space after scan:"
            df -h
            echo ""
          done

          # Run system prune after all built images are scanned
          echo "Running cleanup after built images..."
          docker system prune -af --volumes

          # Scan pre-built images
          PREBUILT_TO_SCAN=$(echo "$PREBUILT_IMAGES" | jq -r '.[]')
          for IMAGE in $PREBUILT_TO_SCAN; do
            echo "=================================================="
            echo "Scanning pre-built image: $IMAGE"
            echo "=================================================="

            # Pull image
            if ! docker pull "$IMAGE" 2>&1; then
              echo "Failed to pull $IMAGE, skipping..."
              continue
            fi

            # Get image details
            IMAGE_SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)

            # Generate safe filename
            SAFE_NAME=$(echo "$IMAGE" | sed 's/[^a-zA-Z0-9._-]/_/g')

            # Run Grype scan
            echo "Running Grype scan..."
            TMPDIR="${GITHUB_WORKSPACE}/tmp"
            mkdir -p "$TMPDIR"

            grype "$IMAGE" -o json > "scan-results/${SAFE_NAME}.json" || true

            rm -rf "$TMPDIR"

            # Append -cg to the image name for Chainguard branch display
            DISPLAY_IMAGE="${IMAGE}-cg"

            # Generate HTML report and get scan data
            SCAN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            SCAN_DATA=$(.github/scripts/generate-scan-report.sh \
              "scan-results/${SAFE_NAME}.json" \
              "scan-results/scans/${SAFE_NAME}.html" \
              "$DISPLAY_IMAGE" \
              "$IMAGE_SIZE" \
              "$SCAN_DATE" \
              "$WORKFLOW_URL")

            echo "$SCAN_DATA" >> "$SCAN_DATA_FILE"

            # Cleanup after each prebuilt image
            echo "Cleaning up..."
            docker rmi "$IMAGE" || true
            docker system prune -af --volumes

            echo "Disk space after cleanup:"
            df -h
            echo ""
          done

      - name: Generate summary page and JSON
        run: |
          .github/scripts/generate-summary.sh \
            "scan-results/summary-data.txt" \
            "scan-results/index.html" \
            "chainguard"

          # Convert summary data to JSON for easier consumption
          python3 << 'PYTHON_JSON'
          import json
          import sys

          scans = []
          with open('scan-results/summary-data.txt', 'r') as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split('|')
                  if len(parts) >= 9:
                      scans.append({
                          'image': parts[0],
                          'size': parts[1],
                          'scanDate': parts[2],
                          'critical': int(parts[3]),
                          'high': int(parts[4]),
                          'medium': int(parts[5]),
                          'low': int(parts[6]),
                          'negligible': int(parts[7]),
                          'total': int(parts[8])
                      })

          with open('scan-results/scan-results.json', 'w') as f:
              json.dump(scans, f, indent=2)

          print(f"Generated JSON with {len(scans)} scans", file=sys.stderr)
          PYTHON_JSON

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-chainguard
          path: scan-results/
          retention-days: 7

  # Deploy to GitHub Pages only after both scans complete
  deploy:
    name: Deploy to GitHub Pages
    needs: [scan-original, scan-chainguard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/original' || github.ref == 'refs/heads/chainguard'

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch both branches for git diff
        run: |
          # Fetch both branches into remote tracking branches
          git fetch origin original
          git fetch origin chainguard

          # List all branches to verify
          echo "=== Available branches ==="
          git branch -a

      - name: Download original scan results
        uses: actions/download-artifact@v4
        with:
          name: scan-results-original
          path: scan-results-original/

      - name: Download chainguard scan results
        uses: actions/download-artifact@v4
        with:
          name: scan-results-chainguard
          path: scan-results-chainguard/

      - name: Verify downloaded artifacts
        run: |
          echo "=== Original scan results ==="
          ls -la scan-results-original/
          echo ""
          echo "=== Chainguard scan results ==="
          ls -la scan-results-chainguard/
          echo ""
          echo "=== Checking for index files ==="
          if [ -f scan-results-original/index.html ]; then
            echo "✓ Original index.html found"
          else
            echo "✗ Original index.html NOT found"
          fi
          if [ -f scan-results-chainguard/index.html ]; then
            echo "✓ Chainguard index.html found"
          else
            echo "✗ Chainguard index.html NOT found"
          fi

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/*.sh

      - name: Prepare GitHub Pages structure
        run: |
          mkdir -p gh-pages/original
          mkdir -p gh-pages/original/scans
          mkdir -p gh-pages/chainguard
          mkdir -p gh-pages/chainguard/scans
          mkdir -p gh-pages/migration
          mkdir -p gh-pages/data

          # Copy original branch results
          cp scan-results-original/index.html gh-pages/original/
          cp scan-results-original/scans/*.html gh-pages/original/scans/ 2>/dev/null || true
          cp scan-results-original/scan-results.json gh-pages/data/original.json

          # Copy chainguard branch results
          cp scan-results-chainguard/index.html gh-pages/chainguard/
          cp scan-results-chainguard/scans/*.html gh-pages/chainguard/scans/ 2>/dev/null || true
          cp scan-results-chainguard/scan-results.json gh-pages/data/chainguard.json

          echo "=== Verify files copied ==="
          ls -la gh-pages/original/
          ls -la gh-pages/chainguard/
          ls -la gh-pages/data/

      - name: Generate main index page
        run: |
          .github/scripts/generate-main-index.sh gh-pages/index.html

      - name: Generate migration page
        run: |
          .github/scripts/generate-migration-page.sh gh-pages/migration/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: false
          destination_dir: .
