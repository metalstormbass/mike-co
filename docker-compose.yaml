services:
  # NGINX Reverse Proxy
  nginx:
    build: ./services/nginx
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - frontend
    networks:
      - rag-network

  # Frontend
  frontend:
    build: ./services/frontend
    networks:
      - rag-network

  # Node.js API Gateway
  api-gateway:
    build: ./services/api-gateway
    environment:
      - NODE_ENV=development
      - OPENSEARCH_URL=http://opensearch:9200
      - POSTGRES_URL=postgresql://rag:rag@postgresql:5432/rag
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - LLM_SERVICE_URL=http://llm-service:8001
      - DOCUMENT_PROCESSOR_URL=http://document-processor:8002
    depends_on:
      - opensearch
      - postgresql
      - redis
    networks:
      - rag-network

  # PyTorch Embedding Service
  embedding-service:
    build:
      context: ./services/embedding-service
      dockerfile: Dockerfile.cpu
    platform: linux/amd64
    environment:
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8002:8000"
    networks:
      - rag-network

  # Ollama (Local LLM)
  ollama:
    image: cgr.dev/mikeco.com/ollama:latest-dev
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - rag-network

  # LLM Service (RAG Query)
  llm-service:
    build: ./services/llm-service
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - OPENSEARCH_URL=http://opensearch:9200
      - USE_OLLAMA=true
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - USE_OPENAI=false
      # - OPENAI_API_KEY=your-key-here  # Uncomment to use OpenAI
      # - OPENAI_MODEL=gpt-3.5-turbo
    ports:
      - "8001:8001"
    depends_on:
      - embedding-service
      - opensearch
      - ollama
    networks:
      - rag-network

  # Document Processor
  document-processor:
    build: ./services/document-processor
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - OPENSEARCH_URL=http://opensearch:9200
      - POSTGRES_URL=postgresql://rag:rag@postgresql:5432/rag
      - REDIS_URL=redis://redis:6379
    ports:
      - "8003:8002"
    depends_on:
      - embedding-service
      - opensearch
      - postgresql
      - redis
    networks:
      - rag-network

  # OpenSearch
  opensearch:
    image: cgr.dev/mikeco.com/opensearch:2
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - rag-network

  # PostgreSQL
  postgresql:
    image: cgr.dev/mikeco.com/postgres:16
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rag-network

  # Redis
  redis:
    image: cgr.dev/mikeco.com/redis:7
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  opensearch-data:
  postgresql-data:
  redis-data:
  ollama-data:
