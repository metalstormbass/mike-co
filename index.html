<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Scan Results</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; padding: 60px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; max-width: 600px; }
        h1 { color: #2c3e50; font-size: 2.5em; margin-bottom: 20px; }
        .subtitle { color: #7f8c8d; font-size: 1.2em; margin-bottom: 40px; }
        .branches { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .branch-link { display: block; padding: 30px 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 12px; font-size: 1.3em; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        .branch-link:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .chainguard { background: linear-gradient(135deg, #00B4D8 0%, #0077B6 100%); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Security Scan Results</h1>
        <p class="subtitle">Container Image Vulnerability Scans</p>
        <div class="branches">
            <a href="original/" class="branch-link">Original Branch</a>
            <a href="chainguard/" class="branch-link chainguard">Chainguard Branch</a>
        </div>
    </div>
</body>
</html>
