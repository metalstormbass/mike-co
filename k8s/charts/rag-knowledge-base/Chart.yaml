apiVersion: v2
name: rag-knowledge-base
description: A Helm chart for RAG Knowledge Base application with Ollama LLM support
type: application
version: 0.2.0
appVersion: "1.1.0"

dependencies:
  - name: opensearch
    version: "2.17.0"
    repository: "https://opensearch-project.github.io/helm-charts/"
    condition: opensearch.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

