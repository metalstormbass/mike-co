apiVersion: v2
name: rag-knowledge-base
description: A Helm chart for RAG Knowledge Base application
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: opensearch
    version: "2.17.0"
    repository: "https://opensearch-project.github.io/helm-charts/"
    condition: opensearch.enabled
  - name: redis
    version: "7.0.0"
    repository: "https://charts.groundhog2k.de"
    condition: redis.enabled
  - name: postgres
    version: "5.0.0"
    repository: "https://charts.groundhog2k.de"
    condition: postgresql.enabled

