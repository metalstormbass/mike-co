{{- if .Values.apiGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.apiGateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rag-knowledge-base.apiGateway.selectorLabels" . | nindent 4 }}
{{- end }}
