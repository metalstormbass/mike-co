apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.labels" . | nindent 4 }}
data:
  OPENSEARCH_URL: {{ .Values.config.opensearchUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | default "rag" | quote }}
  EMBEDDING_SERVICE_URL: "http://{{ include "rag-knowledge-base.fullname" . }}-embedding-service:{{ .Values.embeddingService.service.port }}"
  LLM_SERVICE_URL: "http://{{ include "rag-knowledge-base.fullname" . }}-llm-service:{{ .Values.llmService.service.port }}"
  DOCUMENT_PROCESSOR_URL: "http://{{ include "rag-knowledge-base.fullname" . }}-document-processor:{{ .Values.documentProcessor.service.port }}"
