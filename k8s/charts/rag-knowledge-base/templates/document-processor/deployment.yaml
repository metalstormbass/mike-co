{{- if .Values.documentProcessor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-document-processor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.documentProcessor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.documentProcessor.replicaCount }}
  selector:
    matchLabels:
      {{- include "rag-knowledge-base.documentProcessor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-knowledge-base.documentProcessor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: document-processor
          image: "{{ .Values.global.imageRegistry }}{{ .Values.documentProcessor.image.repository }}:{{ .Values.documentProcessor.image.tag }}"
          imagePullPolicy: {{ .Values.documentProcessor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.documentProcessor.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.documentProcessor.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "rag-knowledge-base.fullname" . }}-config
          resources:
            {{- toYaml .Values.documentProcessor.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- with .Values.documentProcessor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.documentProcessor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.documentProcessor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
