{{- if .Values.documentProcessor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-document-processor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.documentProcessor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.documentProcessor.service.type }}
  ports:
    - port: {{ .Values.documentProcessor.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rag-knowledge-base.documentProcessor.selectorLabels" . | nindent 4 }}
{{- end }}
