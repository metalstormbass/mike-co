{{- if .Values.embeddingService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-embedding-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.embeddingService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.embeddingService.replicaCount }}
  selector:
    matchLabels:
      {{- include "rag-knowledge-base.embeddingService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-knowledge-base.embeddingService.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: embedding-service
          image: "{{ .Values.global.imageRegistry }}{{ .Values.embeddingService.image.repository }}:{{ .Values.embeddingService.image.tag }}"
          imagePullPolicy: {{ .Values.embeddingService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.embeddingService.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.embeddingService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "rag-knowledge-base.fullname" . }}-config
          resources:
            {{- toYaml .Values.embeddingService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      {{- with .Values.embeddingService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddingService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddingService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
