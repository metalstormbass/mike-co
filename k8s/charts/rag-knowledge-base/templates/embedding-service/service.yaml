{{- if .Values.embeddingService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-embedding-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.embeddingService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.embeddingService.service.type }}
  ports:
    - port: {{ .Values.embeddingService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rag-knowledge-base.embeddingService.selectorLabels" . | nindent 4 }}
{{- end }}
