{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.nginx.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rag-knowledge-base.nginx.selectorLabels" . | nindent 4 }}
{{- end }}
