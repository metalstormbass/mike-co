{{- if or .Values.secrets.postgresPassword .Values.secrets.opensearchPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-knowledge-base.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-knowledge-base.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.postgresPassword }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  POSTGRES_URL: {{ printf "postgresql://rag:%s@%s:5432/%s" .Values.secrets.postgresPassword .Values.config.postgresHost .Values.config.postgresDb | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.opensearchPassword }}
  OPENSEARCH_PASSWORD: {{ .Values.secrets.opensearchPassword | b64enc | quote }}
  {{- end }}
{{- end }}
