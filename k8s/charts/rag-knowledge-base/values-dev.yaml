# Development environment overrides

namespace: rag-knowledge-base-dev

# Reduce replicas for dev
apiGateway:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

embeddingService:
  replicaCount: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
      nvidia.com/gpu: "0"
    limits:
      memory: "2Gi"
      cpu: "1000m"
      nvidia.com/gpu: "0"

llmService:
  replicaCount: 1
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
      nvidia.com/gpu: "0"
    limits:
      memory: "8Gi"
      cpu: "2000m"
      nvidia.com/gpu: "0"

documentProcessor:
  replicaCount: 1

frontend:
  replicaCount: 1

nginx:
  replicaCount: 1
  service:
    type: NodePort

# Smaller OpenSearch for dev
opensearch:
  replicas: 1
  opensearchJavaOpts: "-Xmx512m -Xms512m"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  persistence:
    size: 10Gi

# Single Redis for dev
redis:
  redisCluster:
    clusterSize: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# Single PostgreSQL for dev
cnpg:
  instances: 1
  storage:
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

config:
  postgresDb: "rag_dev"
