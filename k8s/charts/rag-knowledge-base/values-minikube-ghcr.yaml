# Minikube values using GHCR pre-built images
# Optimized for local Kubernetes with limited resources

namespace: rag-kb

# Use GHCR images
global:
  imageRegistry: "ghcr.io/"
  imagePullSecrets:
    - name: ghcr-secret

# ============================================
# API Gateway - minimal resources
# ============================================
apiGateway:
  enabled: true
  replicaCount: 1
  image:
    repository: metalstormbass/mike-co/api-gateway
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  env:
    NODE_ENV: "development"

# ============================================
# Embedding Service - CPU only for local dev
# ============================================
embeddingService:
  enabled: true
  replicaCount: 1
  image:
    repository: metalstormbass/mike-co/embedding-service
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
    DEVICE: "cpu"
  tolerations: []

# ============================================
# LLM Service - Uses Ollama for inference
# ============================================
llmService:
  enabled: true
  replicaCount: 1
  image:
    repository: metalstormbass/mike-co/llm-service
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  env:
    USE_OLLAMA: "true"
    USE_OPENAI: "false"
    OLLAMA_MODEL: "mistral"
  tolerations: []

# ============================================
# Ollama - Local LLM Inference
# ============================================
ollama:
  enabled: true
  replicaCount: 1
  image:
    repository: metalstormbass/mike-co/ollama
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 11434
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "2000m"
  persistence:
    enabled: true
    size: 10Gi
  env:
    OLLAMA_NUM_PARALLEL: "1"
    OLLAMA_MAX_LOADED_MODELS: "1"
  tolerations: []

# ============================================
# Document Processor
# ============================================
documentProcessor:
  enabled: true
  replicaCount: 1
  image:
    repository: metalstormbass/mike-co/document-processor
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# ============================================
# Frontend
# ============================================
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: metalstormbass/mike-co/frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# ============================================
# NGINX Reverse Proxy
# ============================================
nginx:
  enabled: true
  replicaCount: 1
  image:
    repository: metalstormbass/mike-co/nginx
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# ============================================
# Ingress - disabled for Minikube (use NodePort)
# ============================================
ingress:
  enabled: false

# ============================================
# OpenSearch - Single node for local
# ============================================
opensearch:
  enabled: true
  replicas: 1
  singleNode: true
  opensearchJavaOpts: "-Xmx512m -Xms512m"
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "1536Mi"
  persistence:
    enabled: true
    size: 5Gi
  extraEnvs:
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
    - name: discovery.type
      value: "single-node"

# ============================================
# Redis - Minimal for local
# ============================================
redis:
  enabled: true
  image:
    repository: metalstormbass/mike-co/redis
    tag: latest
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  storage:
    requestedSize: 1Gi

# ============================================
# PostgreSQL - Minimal for local
# ============================================
postgresql:
  enabled: true
  image:
    repository: metalstormbass/mike-co/postgresql
    tag: latest
  settings:
    superuser: rag
    superuserPassword: ragpassword
    defaultDatabase: rag
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  storage:
    requestedSize: 2Gi

# ============================================
# Config
# ============================================
config:
  opensearchUrl: "http://rag-kb-opensearch:9200"
  redisUrl: "redis://rag-kb-redis:6379"
  postgresHost: "rag-kb-postgresql"
  postgresDb: "rag"
  postgresUser: "rag"

secrets:
  postgresPassword: "ragpassword"
